substitutions:
  name: pinpad-kellertuer
  board: esp01_1m

packages:
  wifi: !include common/wifi.yaml
  device_base: !include common/device_base.yaml

globals:
  - id: pin_seq
    type: int
    restore_value: false
    initial_value: '0'

matrix_keypad:
  id: keypad
  rows:
    - pin: GPIO00
    - pin: GPIO12
    - pin: GPIO13
    - pin: GPIO14
  columns:
    - pin: GPIO04
    - pin: GPIO05
    - pin: GPIO02
  keys: "123456789*0#"
  has_diodes: false

key_collector:
  - id: pincode
    source_id: keypad
    max_length: 20
    end_keys: "#"
    end_key_required: true
    clear_keys: "*"
    allowed_keys: "0123456789"
    timeout: 5s
    on_progress:
      - output.turn_on: buzzer
      - delay: 40ms
      - output.turn_off: buzzer
    on_result:
      - globals.set:
          id: pin_seq
          value: !lambda 'return id(pin_seq) + 1;'
      - text_sensor.template.publish:
          id: pincode_text
          state: !lambda 'return x + "#" + to_string(id(pin_seq));'
    on_timeout:
      - output.turn_on: buzzer
      - delay: 40ms
      - output.turn_off: buzzer
      - delay: 40ms
      - output.turn_on: buzzer
      - delay: 40ms
      - output.turn_off: buzzer
      - delay: 40ms
      - output.turn_on: buzzer
      - delay: 40ms
      - output.turn_off: buzzer

output:
  - platform: gpio
    id: buzzer
    pin: GPIO16
    inverted: true

text_sensor:
  - platform: template
    name: "pincode"
    id: pincode_text

api:
  actions:
    - action: send_beep
      variables:
        type: string
      then:
        - if:
            condition:
              lambda: 'return type == "beep";'
            then:
              - output.turn_on: buzzer
              - delay: 80ms
              - output.turn_off: buzzer
        - if:
            condition:
              lambda: 'return type == "beep2";'
            then:
              - output.turn_on: buzzer
              - delay: 80ms
              - output.turn_off: buzzer
              - delay: 200ms
              - output.turn_on: buzzer
              - delay: 80ms
              - output.turn_off: buzzer
        - if:
            condition:
              lambda: 'return type == "beeep";'
            then:
              - output.turn_on: buzzer
              - delay: 200ms
              - output.turn_off: buzzer
        - if:
            condition:
              lambda: 'return type == "beeeep";'
            then:
              - output.turn_on: buzzer
              - delay: 1000ms
              - output.turn_off: buzzer
