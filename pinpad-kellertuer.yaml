substitutions:
  name: pinpad-kellertuer
  board: esp01_1m

packages:
  wifi: !include common/wifi.yaml
  device_base: !include common/device_base.yaml

matrix_keypad:
  id: keypad
  rows:
    - pin: GPIO00
    - pin: GPIO12
    - pin: GPIO13
    - pin: GPIO14
  columns:
    - pin: GPIO04
    - pin: GPIO05
    - pin: GPIO02
  keys: "123456789*0#"
  has_diodes: false

key_collector:
  - id: pincode
    source_id: keypad
    max_length: 20
    end_keys: "#"
    end_key_required: true
    clear_keys: "*"
    allowed_keys: "0123456789"
    timeout: 5s
    on_progress:
      - output.turn_on: buzzer
      - delay: 40ms
      - output.turn_off: buzzer
    on_result:
      - homeassistant.event:
          event: esphome.pinpad_kellertuer_pin_eingegeben
          data_template:
            pin: "P{{ pin_value }}"
          variables:
            pin_value: !lambda 'return x;'
    on_timeout:
      - output.turn_on: buzzer
      - delay: 40ms
      - output.turn_off: buzzer
      - delay: 40ms
      - output.turn_on: buzzer
      - delay: 40ms
      - output.turn_off: buzzer
      - delay: 40ms
      - output.turn_on: buzzer
      - delay: 40ms
      - output.turn_off: buzzer

output:
  - platform: gpio
    id: buzzer
    pin: GPIO16
    inverted: true

api:
  actions:
    - action: send_beep
      variables:
        type: string
      then:
        - if:
            condition:
              lambda: 'return type == "beep";'
            then:
              - output.turn_on: buzzer
              - delay: 80ms
              - output.turn_off: buzzer
        - if:
            condition:
              lambda: 'return type == "beep2";'
            then:
              - output.turn_on: buzzer
              - delay: 80ms
              - output.turn_off: buzzer
              - delay: 200ms
              - output.turn_on: buzzer
              - delay: 80ms
              - output.turn_off: buzzer
        - if:
            condition:
              lambda: 'return type == "beeep";'
            then:
              - output.turn_on: buzzer
              - delay: 200ms
              - output.turn_off: buzzer
        - if:
            condition:
              lambda: 'return type == "beeeep";'
            then:
              - output.turn_on: buzzer
              - delay: 1000ms
              - output.turn_off: buzzer
