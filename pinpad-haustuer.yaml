substitutions:
  name: pinpad-haustuer
  platform: ESP32
  board: wemos_d1_mini32

packages:
  wifi: !include common/wifi.yaml
  device_base: !include common/device32_base.yaml

logger:
    level: DEBUG
    baud_rate: 0

globals:
  - id: pin_seq
    type: int
    restore_value: false
    initial_value: '0'

matrix_keypad:
  id: keypad
  # Rubberdome keypad
  rows:
    - pin: GPIO01 # R1
    - pin: GPIO27 # R2
    - pin: GPIO16 # R3
    - pin: GPIO21 # R4
  columns:
    - pin: GPIO32 # C1
    - pin: GPIO25 # C2
    - pin: GPIO04 # C3
  keys: "123456789*0#"
  has_diodes: false

key_collector:
  - id: pincode
    source_id: keypad
    max_length: 20
    end_keys: "#"
    end_key_required: true
    clear_keys: "*"
    allowed_keys: "0123456789"
    timeout: 5s
    on_progress:
      - output.turn_on: buzzer
      - delay: 10ms
      - output.turn_off: buzzer
    on_result:
      - globals.set:
          id: pin_seq
          value: !lambda 'return id(pin_seq) + 1;'
      - text_sensor.template.publish:
          id: pincode_text
          state: !lambda 'return x + "#" + to_string(id(pin_seq));'
    on_timeout:
      - output.turn_on: buzzer
      - delay: 10ms
      - output.turn_off: buzzer
      - delay: 10ms
      - output.turn_on: buzzer
      - delay: 10ms
      - output.turn_off: buzzer
      - delay: 10ms
      - output.turn_on: buzzer
      - delay: 10ms
      - output.turn_off: buzzer

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO03
      mode:
        input: true
        pullup: true
      inverted: true
    id: button1
    name: "button1"
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - switch.turn_on: relay1
#        - switch.turn_on: relay2
        - delay: 200ms
        - switch.turn_off: relay1
#        - switch.turn_off: relay2

  - platform: gpio
    pin:
      number: GPIO23
      mode:
        input: true
        pullup: true
      inverted: true
    id: button2
    name: "button2"
    filters:
      - delayed_on: 20ms
    on_press:
      then:
#       - switch.turn_on: relay1
        - switch.turn_on: relay2
        - delay: 200ms
#        - switch.turn_off: relay1
        - switch.turn_off: relay2

switch:
  - platform: gpio
    pin: GPIO18
    id: relay1
    name: relay1

  - platform: gpio
    pin: GPIO19
    id: relay2
    name: relay2

output:
  - platform: gpio
    id: buzzer
    pin: GPIO26

text_sensor:
  - platform: template
    name: "pincode"
    id: pincode_text

api:
  actions:
    - action: send_beep
      variables:
        type: string
      then:
        - if:
            condition:
              lambda: 'return type == "beep";'
            then:
              - output.turn_on: buzzer
              - delay: 70ms
              - output.turn_off: buzzer
        - if:
            condition:
              lambda: 'return type == "beep2";'
            then:
              - output.turn_on: buzzer
              - delay: 50ms
              - output.turn_off: buzzer
              - delay: 200ms
              - output.turn_on: buzzer
              - delay: 50ms
              - output.turn_off: buzzer
        - if:
            condition:
              lambda: 'return type == "beeep";'
            then:
              - output.turn_on: buzzer
              - delay: 200ms
              - output.turn_off: buzzer
        - if:
            condition:
              lambda: 'return type == "beeeep";'
            then:
              - output.turn_on: buzzer
              - delay: 1000ms
              - output.turn_off: buzzer
