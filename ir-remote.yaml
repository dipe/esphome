substitutions:
  name: ir-remote
  board: esp01_1m

packages:
  wifi: !include common/wifi.yaml
  device_base: !include common/device_base.yaml

switch:
  - platform: gpio
    pin: GPIO5
    name: receiver

remote_receiver:
  pin:
    number: GPIO4
    inverted: true
  dump: pronto

remote_transmitter:
  pin: GPIO16
  carrier_duty_percent: 50%

api:
  actions:
    - action: send_pronto
      variables:
        data: string
      then:
        - remote_transmitter.transmit_pronto:
            data: !lambda 'return data;'

